[project]
name = "cbm-prune"
version = "0.1.0"
description = "Preview and prune stale codebase-memory-mcp projects"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/jbayliss-harborglobal/cbm-prune"

[project.scripts]
cbm-prune = "cbm_prune:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.6",
    "ty>=0.0.112",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PL", "RUF"]
allowed-confusables = ["×"]
